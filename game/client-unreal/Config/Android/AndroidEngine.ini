; Additional Android packaging settings
; ملاحظة: هذا الملف يحمل أولوية على DefaultEngine.ini عند بناء Android.
; P7-T12 + مراجعة 2026-08-13: bBuildForES31 كان False مع bSupportsOpenGL3=False،
; فلم يُولَّد GLES 3.1 shaders في APK، وأي جهاز بلا Vulkan كان يعرض
; "This device does not support Vulkan but the app was not packaged with ES 3.1 support."
; الإصلاح: ES31 + OpenGL3 مفعّلان، Vulkan متاح كخيار ثانوي غير إلزامي،
; bUseExternalFilesDir=True ليطابق DefaultEngine.ini (وإلا يحاول UE كتابة OBB).
; مراجعة P8-Descriptor 2026-08-13: bDetectIfAppShouldRun=False لتجاوز فحص وجود
; ملف وصف المشروع (.uproject) على الجهاز — بدونه يعرض UE خطأ `Failed to open
; descriptor file ../../Rok2/Rok2.uproject` عند بدء التشغيل. الملف هنا يحمل أولوية
; على DefaultEngine.ini عند بناء Android.
[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
bBuildForES31=True
bSupportsVulkan=True
bSupportsOpenGL3=True
PackageName=com.rok2.thrones
bPackageDataInsideApk=True
bUseExternalFilesDir=True
bEnableGooglePlaySupport=False
bForcePortrait=False
AndroidOrientation=Landscape
MinSDKVersion=26
TargetSDKVersion=34
StoreVersion=1
VersionDisplayName=0.1.0
bDetectIfAppShouldRun=False
; P7-T11 إصلاح 2026-08-13 (BF-007): إلزام UE بتفعيل ManifestRequirementsOverride.txt —
; بدونه قد يتجاهل UE الملف ويضيف صلاحيات التخزين القديمة تلقائيًا فتظهر شاشة
; "Permission Required — Storage" المعلقة التي لا تجد لها بندًا في الإعدادات.
; يجب حذف Intermediate/Android وإعادة البناء بعد هذا التغيير.
bEnableManifestRequirements=True
