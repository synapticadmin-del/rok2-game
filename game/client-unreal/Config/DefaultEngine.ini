UIScaleCurve=(EditorCurveData=(Keys=((Time=480.000000,Value=0.750000),(Time=720.000000,Value=1.000000),(Time=1080.000000,Value=1.150000),(Time=1440.000000,Value=1.300000),(Time=2160.000000,Value=1.600000))),ExternalCurve=None)

; ===========================================================
;  الكاميرا — ثبات الإطار بين المحرر والهاتف
;  الإطار يجب أن يكون واحداً على كل جهاز. مع MaintainYFOV يبقى مجال الرؤية
;  الرأسي ثابتاً مهما اتسعت الشاشة (16:9 في المحرر، 19.5:9 و21:9 على الهواتف)،
;  فيرى اللاعب نفس عمق المشهد الذي ضُبطت عليه زاوية الميل، وأي عرض إضافي
;  على الهاتف العريض يكون زيادة على الجانبين لا تغييراً في الزاوية.
;  ARok2IsometricCamera يفرض القيمة نفسها على مكوّن الكاميرا صراحةً حتى لا
;  يتسرّب اختلاف من إعدادات جهاز أو ملف تهيئة آخر.
; ===========================================================
