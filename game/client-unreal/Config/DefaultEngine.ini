; ===========================================================
;  واجهة المستخدم — مقياس DPI للهاتف
;  كان هذا القسم غائباً تماماً فورث المشروع منحنى المحرك الافتراضي على
;  ShortestSide: هاتف 720p يحصل على مقياس 0.666 فتصغر كل الأحجام المطلقة
;  المكتوبة في كود الواجهات، وهذا سبب أساسي لرداءة الواجهة على الهاتف.
;  اللعبة أفقية (Landscape) دائماً، فالبُعد الأقصر هو الارتفاع — نثبّت
;  المقياس 1.0 من 720 ارتفاعاً وفوق، ونسمح بتصغير محدود تحت ذلك فقط.
; ===========================================================
[/Script/Engine.UserInterfaceSettings]
RenderFocusRule=Never
