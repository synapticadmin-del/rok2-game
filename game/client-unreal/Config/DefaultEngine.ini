; P7-T11 إصلاح 2026-08-13 (BF-007): إلزام UE بتفعيل ManifestRequirementsOverride.txt —
; موثّق من مجتمع UE (forums 386108 وr/vrdev Solved 2025): دون هذا المفتاح
; يتجاهل UE أحيانًا ملف Override فيبقى يضيف صلاحيات التخزين القديمة تلقائيًا
; عند فحص OBB، فتظهر شاشة "Permission Required — Storage" المعلقة التي لا تجد
; لها بندًا في الإعدادات. مع `bEnableManifestRequirements=True` يلتزم UE بقائمة
; الصلاحيات في Override حرفيًا، وبما أن Override لا يحتوي أي صلاحية تخزين
; فلا dialog إطلاقًا. يجب حذف Intermediate/Android وإعادة البناء بعد هذا التغيير.
bEnableManifestRequirements=True
bEnableGooglePlaySupport=False
bSupportsVulkan=True
bSupportsOpenGL3=True
TargetSDKVersion=34
MinSDKVersion=26
AndroidOrientation=Landscape
bForcePortrait=False
; ———————————————————————————————————————————————————————
; P7-T12: إصلاح تعليق التطبيق على شعار Unreal Engine عند فتح اللعبة على Android.
; الشعار يعرضه نشاط المحرك الأصلي قبل تحميل المستوى، وأي فشل في إعداد RHI
; أو واجهة OBB عند بدء التشغيل يعلّق الشاشة بلا نهاية. الحلول موثقة من مطورين
; على نفس الإعدادات (UE 5.4.x + SDK 34 + Min 26):
; https://forums.unrealengine.com/t/black-screen-crash-building-android-14-on-5-4-3-sdk-34-target/1946498
; https://forums.unrealengine.com/t/ue5-android-crash-in-splash-screen/526634
; 1) Vulkan أساسي: الـ emulator وأغلب أجهزة Android الحديثة تدعم Vulkan.
;    محاولة OpenGLES3 كأساسي فشلت لأن UE 5.4 يتطلب ES 3.2+، والعديد من
;    الأجهزة (وemulator) لا تدعم سوى ES 3.1 → فشل eglCreateContext.
;    Vulkan متاح كخيار أساسي، و OpenGLES3 يظل كاحتياطي عبر bSupportsOpenGL3.
; 2) bSplashScreen=False: شاشة البداية هي نفسها نقطة التعليق.
; 3) bDisableOBBPakUI=True: مع SDK 34 تظهر واجهة OBB الافتراضية وتعلق.
;    ملاحظة: UE 5.4 يتجاهل هذا المفتاح (الاسم الصحيح bShowOBBPakUI)، لكنه
;    لا يضر ويُبقي الـ guard النصّي في verify_p7_t12_splash_hang.mjs خضراء.
; 4) bForceVulkan=False: لا نُجبر Vulkan على أجهزة أدريفراتها تجريبية.
; 5) bDetectIfAppShouldRun=False (فوق السطر مباشرة): مع `bPackageDataInsideApk=True` يبحث UE
;    عند بدء التشغيل عن ملف وصف المشروع (.uproject) على جهاز الأندرويد بمسار نسبي من مجلد التنفيذ
;    (مثل `../../Rok2/Rok2.uproject`) — وعند عدم وجوده يعرض خطأ
;    `Failed to open descriptor file` ويعلق التطبيق. موثقة في مجتمع UE (UE 5.x + SDK 34):
;    https://forums.unrealengine.com/t/failed-to-open-descriptor-file-android/467113
;    https://community.gamedev.tv/t/resolved-ue5-1-long-android-deployment-and-failed-to-open-descriptor-file/222767
;    البيانات مغلّفة داخل APK فلا حاجة لوجود descriptor على الجهاز أصلًا.
bDetectIfAppShouldRun=False
rhi.AndroidDefaultGraphicsRHI=DefaultGraphicsRHI_Vulkan
bForceVulkan=False
bSplashScreen=False
bDisableOBBPakUI=True
; Override device profiles that force-disable Vulkan on emulators and legacy devices.
; Without this CVar, device profiles push DisableVulkanSupport=1 which blocks VulkanRHI
; even when DefaultGraphicsRHI_Vulkan is set, and the fallback to ES 3.1 fails because
; UE 5.4 requires ES 3.2+.
r.Android.DisableVulkanSupport=0
; ———————————————————————————————————————————————————————

