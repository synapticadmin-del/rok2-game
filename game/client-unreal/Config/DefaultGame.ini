[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=ROK2
ProjectVersion=0.1.0
CompanyName=ROK2
bStartInVR=False

; ===========================================================
;  Packaging
;  كان هذا القسم موضوعاً في DefaultEngine.ini، وهذا خطأ صامت:
;  UProjectPackagingSettings معلَّنة UCLASS(config=Game) فتقرأ DefaultGame.ini
;  فقط. أي أن UsePakFile و bUseIoStore و MapsToCook لم تُطبَّق يوماً، وكان
;  الكوك يعتمد كلياً على -cookall في Build-Rok2.ps1. أي سكربت بناء لا يمرّر
;  -cookall (BuildAndroid.bat مثلاً) كان ينتج APK ناقص الأصول.
; ===========================================================
[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
FullRebuild=False
ForDistribution=False
IncludeDebugFiles=False
UsePakFile=True
bCompressed=True
bUseIoStore=False
bShareMaterialShaderCode=True
+MapsToCook=(FilePath="/Game/Maps/Rok2Main")

; الأصول التي يحمّلها الكود بـ LoadObject في وقت التشغيل لا يراها الكوك
; كمراجع صريحة، فلا تُحزَّم إلا إذا ذُكر مجلدها هنا:
;   /Game/Art/Materials  — M_Rok2Base و M_Rok2Unlit: مصدر كل ألوان القلعة
;                          والسور والمباني. بدونها يعود كل شيء رمادياً.
;   /Game/Art/*          — أيقونات وخلفيات وصور مباني تُحمَّل بالمسار النصي.
;   /Engine/BasicShapes  — كل الأشكال placeholder (مكعب/أسطوانة/مخروط/كرة/مستوى).
+DirectoriesToAlwaysCook=(Path="/Game/Art/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Art/UIIcons")
+DirectoriesToAlwaysCook=(Path="/Game/Art/UIButtons")
+DirectoriesToAlwaysCook=(Path="/Game/Art/CityBuildingIcons")
+DirectoriesToAlwaysCook=(Path="/Game/Art/CivIcons")
+DirectoriesToAlwaysCook=(Path="/Game/Art/CivBackgrounds")
+DirectoriesToAlwaysCook=(Path="/Game/Art/WorldMapIcons")
+DirectoriesToAlwaysCook=(Path="/Game/Art/Commanders")
+DirectoriesToAlwaysCook=(Path="/Game/Art/kaykit")
+DirectoriesToAlwaysCook=(Path="/Game/Fonts")
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
