<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1220" />
  <title>ROK2 — Thrones of Ages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <section id="screen-boot" class="screen active">
      <div class="hero">
        <div class="logo">⚔</div>
        <h1>Thrones of Ages</h1>
        <p class="sub">ROK2 Prototype · Online Kingdom</p>
        <div id="boot-status" class="status">جاري الاتصال بالسيرفر...</div>
        <button id="btn-enter" class="btn primary" disabled>دخول المملكة</button>
        <p class="tiny">API: <span id="api-label"></span></p>
      </div>
    </section>

    <section id="screen-civ" class="screen">
      <header class="top"><h2>اختر حضارتك</h2></header>
      <div id="civ-list" class="civ-list"></div>
      <div class="bottom-bar">
        <input id="player-name" class="input" maxlength="20" placeholder="اسم الحاكم" />
        <button id="btn-start" class="btn primary" disabled>ابدأ</button>
      </div>
    </section>

    <section id="screen-city" class="screen">
      <header class="top bar">
        <div>
          <div class="title" id="city-title">المدينة</div>
          <div class="muted" id="city-civ"></div>
        </div>
        <button class="btn ghost" data-nav="map">الخريطة 🗺</button>
      </header>
      <div class="resources" id="resources"></div>
      <div class="panel">
        <h3>المباني</h3>
        <div id="buildings" class="list"></div>
      </div>
      <div class="panel">
        <h3>الجنود</h3>
        <div id="troops" class="list"></div>
        <div class="row">
          <select id="train-unit" class="input">
            <option value="infantry_t1">مشاة T1</option>
            <option value="cavalry_t1">فرسان T1</option>
            <option value="archer_t1">رماة T1</option>
          </select>
          <input id="train-count" class="input small" type="number" value="50" min="1" max="1000" />
          <button id="btn-train" class="btn">تدريب</button>
        </div>
      </div>
      <div class="panel">
        <h3>التحالف</h3>
        <div id="alliance-box" class="muted">لا يوجد</div>
        <div class="row">
          <input id="all-name" class="input" placeholder="اسم التحالف" />
          <input id="all-tag" class="input small" placeholder="TAG" maxlength="4" />
          <button id="btn-create-all" class="btn">إنشاء</button>
        </div>
      </div>
      <div class="bottom-nav">
        <button class="btn primary" data-nav="map">افتح الخريطة</button>
        <button class="btn ghost" id="btn-refresh-city">تحديث</button>
      </div>
    </section>

    <section id="screen-map" class="screen">
      <header class="top bar">
        <button class="btn ghost" data-nav="city">المدينة</button>
        <div class="title">خريطة المملكة</div>
        <button class="btn ghost" id="btn-center">مركزي</button>
      </header>
      <div class="map-wrap">
        <canvas id="map" width="360" height="360"></canvas>
        <div class="map-hud">
          <div id="map-info" class="pill">—</div>
          <div id="selected-info" class="pill dim">اختر ممر أو مورد</div>
        </div>
      </div>
      <div class="panel compact">
        <div class="row">
          <select id="march-unit" class="input">
            <option value="infantry_t1">مشاة</option>
            <option value="cavalry_t1">فرسان</option>
            <option value="archer_t1">رماة</option>
          </select>
          <input id="march-count" class="input small" type="number" value="100" min="1" />
          <button id="btn-attack" class="btn danger" disabled>هجوم الممر</button>
          <button id="btn-gather" class="btn" disabled>جمع/وحش</button>
        </div>
        <div class="row">
          <button id="btn-snapshot" class="btn ghost">تحديث العالم</button>
          <button id="btn-ws" class="btn ghost">اتصال حي</button>
        </div>
      </div>
      <div class="panel compact">
        <h3>تقارير</h3>
        <div id="reports" class="reports"></div>
      </div>
      <div id="toast" class="toast hidden"></div>
    </section>
  </div>
  <script src="./app.js"></script>
</body>
</html>
